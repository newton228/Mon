<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carlos</title>
  <style>
    :root {
      font-family: Georgia, 'Times New Roman', serif;
      color: #28231f;
      background: #f5f0e8;
    }

    body {
      margin: 0;
      padding: 3rem 1.25rem;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: clamp(2.5rem, 8vw, 4.5rem);
    }

    .image-slot {
      display: grid;
      place-items: center;
      width: min(100%, 360px);
      aspect-ratio: 1 / 1;
      margin: 2rem 0 1.5rem;
      margin-left: auto;
      margin-right: auto;
      text-align: center;
    }

    .image-slot img {
      display: block;
      width: 100%;
      height: 100%;
      border: 8px solid #fffdf9;
      background: #ebe4d7;
      object-fit: cover;
      box-shadow: 0 8px 18px rgba(31, 41, 51, 0.13);
    }

    .description-title {
      margin-bottom: 0.5rem;
      font-weight: bold;
    }

    .description {
      padding: 1rem;
      border: 1px solid #b7a797;
      background: #fffdf9;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      color: inherit;
    }
  </style>
</head>
<body>
  <main>
    <h1>Carlos</h1>
    <section class="image-slot" aria-label="Carlos photo">
      <img src="Snapchat-1849924486.jpg" alt="Carlos">
    </section>

    <section>
      <div class="description-title">why you may ask?</div>
      <div class="description">
        <p>just for fun. i could remove it if you dont like it</p>
      </div>
    </section>

    <a href="home.html">Back to The Site</a>
  </main>
</body>
</html>
